<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBIT Cricket | Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-medal"></i>
                <h2>SBIT<span>Cricket</span></h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="#"><i class="fa-solid fa-users"></i> Team</a>
                <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header Section (Stats) -->
            <header class="top-header">
                <div class="team-info">
                    <h1>Overview</h1>
                    <p class="subtitle">SBIT Team Management Portal</p>
                </div>
                
                <div class="stats-container">
                    <div class="stat-box premium-glass">
                        <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                        <div class="stat-details">
                            <p>Total Players</p>
                            <h3 id="stat-total-players">0</h3>
                        </div>
                    </div>
                    <div class="stat-box premium-glass highlight-glass">
                        <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
                        <div class="stat-details">
                            <p>Combined Score</p>
                            <h3 id="stat-combined-score">0</h3>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <section class="dashboard-content">
                <!-- Players List -->
                <div class="players-section premium-glass">
                    <div class="section-header">
                        <h2>Active Roster</h2>
                        <button class="primary-btn" id="open-modal-btn"><i class="fa-solid fa-plus"></i> Add Player</button>
                    </div>
                    
                    <div class="players-grid" id="players-list">
                        <!-- Dynamic Player Cards will go here -->
                        <div class="empty-state">Loading players...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Player Modal -->
    <div class="modal-overlay" id="player-modal">
        <div class="modal-content premium-glass">
            <div class="modal-header">
                <h3 id="modal-title">Add New Player</h3>
                <button class="close-btn" id="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="player-form">
                <input type="hidden" id="player-id">
                <div class="form-group">
                    <label>Player Name</label>
                    <input type="text" id="player-name" placeholder="e.g. Virat Kohli" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="player-age" placeholder="e.g. 25" required>
                    </div>
                    <div class="form-group">
                        <label>Total Score</label>
                        <input type="number" id="player-score" placeholder="e.g. 1500" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">Save Player</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
